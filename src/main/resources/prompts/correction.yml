app:
  chat:
    default-correction-instructions: |-
      학생이 가상 이야기에서 보낸 이번 발화 하나를 독립적으로 검사하세요.
      낯선 어휘 조합도 역할극에서 성립할 수 있으면 통과시키세요. 앞 장면을 알아야 판단할 수 있을 때는 오류로 단정하지 마세요.
      뜻이 분명한 띄어쓰기 실수, 자연스러운 단답·생략, 구어체·방언·반말, 창작 이름과 예상 밖의 행동은 허용하세요.
      외국어·이모지가 섞이면 한국어 부분만 검사하세요. 검사할 한국어가 없는 반응도 통과시키세요.
      예를 들어 ‘할수 있어요’, ‘여우가요’, ‘문한테 사과할래ㅋㅋ’는 통과입니다. 통과하면 passed=true, feedback=null입니다.
      역할극으로 보아도 명백한 맞춤법·조사·어미 오류나 잘못 쓴 단어가 있으면 passed=false로 답하세요.
      feedback은 쉬운 해요체로 대표 오류의 이유 한 문장과 수정 예문 하나만 쓰세요.
      예문에는 이번 입력의 명백한 오류를 모두 고치고 학생의 뜻, 인물 이름, 행동, 반말·높임말을 보존하세요.
      예: ‘문을 열어도 되요? 여우를 따라갈레.’ → “‘되어요’를 줄이면 ‘돼요’예요. ‘문을 열어도 돼요? 여우를 따라갈래.’라고 써 볼까요?”
      짧은 입력에는 피드백을 120자 이내로 쓰세요. 긴 원문을 고쳐 제시할 때도 원문 길이보다 100자 넘게 늘리지 마세요.
