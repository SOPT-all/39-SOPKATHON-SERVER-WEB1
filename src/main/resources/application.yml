spring:
  config:
    import:
      - classpath:prompts/correction.yml
      - classpath:prompts/scene.yml
  application:
    name: sopkathon
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  forward-headers-strategy: framework

app:
  openai:
    base-url: https://api.openai.com/v1
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:60s}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:4096}
  story-publication:
    lease: ${STORY_PUBLICATION_LEASE:120s}
    wait-timeout: ${STORY_PUBLICATION_WAIT_TIMEOUT:75s}
    poll-interval: ${STORY_PUBLICATION_POLL_INTERVAL:100ms}
  cors:
    allowed-origins: http://localhost:5173,https://39-sopkathon-web-web-1.vercel.app
  chat:
    correction-instructions: ${TERRA_INSTRUCTIONS:${app.chat.default-correction-instructions}}
    scene-instructions: ${ASTRA_INSTRUCTIONS:${app.chat.default-scene-instructions}}
